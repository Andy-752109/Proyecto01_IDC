services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Fijo a 3100, sin interpolar ${PORT} desde .env: Compose carga .env
      # automáticamente para resolver variables del propio archivo (no solo
      # para el contenedor vía env_file), y .env trae PORT=3000 para el modo
      # on-premise (npm run dev). Si aquí se interpola ${PORT:-3100}, ese
      # 3000 gana y producción termina sirviendo en el puerto equivocado.
      NODE_ENV: production
      PORT: "3100"
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    ports:
      - "3100:3100"
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MARIADB_DATABASE: ${DB_NAME:-annotation_portal}
      MARIADB_USER: ${DB_USER:-annotation_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
  minio_data:
